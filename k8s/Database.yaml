apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartshelf-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshelf-postgres
  labels:
    app: smartshelf-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshelf-postgres
  template:
    metadata:
      labels:
        app: smartshelf-postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: smartshelf
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: smartshelf-db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartshelf-db-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smartshelf-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartshelf-mongodb-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshelf-mongodb
  labels:
    app: smartshelf-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshelf-mongodb
  template:
    metadata:
      labels:
        app: smartshelf-mongodb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartshelf-db-secrets
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartshelf-db-secrets
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smartshelf-mongodb-data
