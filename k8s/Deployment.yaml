apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshelf-storefront
  labels:
    app: smartshelf-storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartshelf-storefront
  template:
    metadata:
      labels:
        app: smartshelf-storefront
    spec:
      containers:
        - name: storefront
          image: YOUR_ACR_NAME.azurecr.io/smartshelf-storefront:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SEARCH_URL
              value: http://smartshelf-search:3002
            - name: RECOMMENDATIONS_URL
              value: http://smartshelf-recommendations:3003
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
---
