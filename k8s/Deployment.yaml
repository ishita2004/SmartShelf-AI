apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshelf-ai
  labels:
    app: smartshelf-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartshelf-ai
  template:
    metadata:
      labels:
        app: smartshelf-ai
    spec:
      containers:
        - name: smartshelf-ai
          image: smartshelf-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
