apiVersion: v1
kind: Service
metadata:
  name: smartshelf-postgres
spec:
  type: ClusterIP
  selector:
    app: smartshelf-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-mongodb
spec:
  type: ClusterIP
  selector:
    app: smartshelf-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-storefront
  labels:
    app: smartshelf-storefront
spec:
  type: LoadBalancer
  selector:
    app: smartshelf-storefront
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-chatbot
spec:
  type: ClusterIP
  selector:
    app: smartshelf-chatbot
  ports:
    - name: http
      port: 3005
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-catalog
spec:
  type: ClusterIP
  selector:
    app: smartshelf-catalog
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-search
spec:
  type: ClusterIP
  selector:
    app: smartshelf-search
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-recommendations
spec:
  type: ClusterIP
  selector:
    app: smartshelf-recommendations
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: smartshelf-reviews
spec:
  type: ClusterIP
  selector:
    app: smartshelf-reviews
  ports:
    - name: http
      port: 3004
      targetPort: http
